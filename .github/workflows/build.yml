name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip pillow

      - name: Build userscript
        run: python src/build.py

      - name: Build extension
        run: python src/build_extension.py

      - name: Syntax check (node)
        run: |
          node --check dist/chaoxing-ai-helper.user.js
          node --check dist/chaoxing-ai-helper-extension/src/bundle.js

      - name: Verify no preset account pool
        run: |
          grep -q 'var CRACK_SEED = \[\];' dist/chaoxing-ai-helper.user.js
          echo "OK: 构建产物不含预设账号池"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-ai-helper
          path: |
            dist/chaoxing-ai-helper.user.js
            dist/chaoxing-ai-helper-extension.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chaoxing-ai-helper.user.js
            dist/chaoxing-ai-helper-extension.zip
          generate_release_notes: true
